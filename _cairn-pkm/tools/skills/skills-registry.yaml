# Professional Skills Registry
# Default skill framework shipped with Cairn-PKM
# 
# Location: _cairn-pkm/data/skills/skills-registry.yaml
# 
# To customize: Copy to _local/data/skills/skills-registry.yaml and modify.
# Your local version will override this default.
#
# This framework covers common skills across technical and non-technical roles.
# Modify categories and skills to match your career goals.

framework_name: "Professional Skills"
framework_version: "1.0"

# Five-level proficiency scale
levels:
  1:
    name: "Awareness"
    description: "Basic understanding. Can recognize concepts and follow guidance."
  2:
    name: "Developing"
    description: "Growing capability. Can perform tasks with some oversight."
  3:
    name: "Competent"
    description: "Solid proficiency. Works independently on typical challenges."
  4:
    name: "Advanced"
    description: "Deep expertise. Handles complex situations, guides others."
  5:
    name: "Expert"
    description: "Recognized authority. Shapes practices, strategic impact."

# Level determination rules
level_rules:
  instance_thresholds:
    level_2: 2     # 2-4 documented instances
    level_3: 5     # 5-9 instances
    level_4: 10    # 10-19 instances
    level_5: 20    # 20+ instances
  
  # Achievements that indicate specific levels
  achievements:
    level_4:
      - "mentored team member"
      - "led project"
      - "significant process improvement"
      - "cost savings demonstrated"
    level_5:
      - "organization-wide adoption"
      - "published work"
      - "conference presentation"
      - "industry recognition"

# =============================================================================
# SKILL CATEGORIES
# =============================================================================

categories:

  # ---------------------------------------------------------------------------
  # TECHNICAL FOUNDATIONS
  # Skills for working with technology, regardless of specific role
  # ---------------------------------------------------------------------------
  technical:
    name: "Technical Skills"
    skills:
      - id: programming
        name: "Programming & Scripting"
        description: "Writing code to automate tasks or build applications"
        keywords: ["code", "script", "programming", "python", "javascript", "bash", "automation"]
      
      - id: data_analysis
        name: "Data Analysis"
        description: "Extracting insights from data"
        keywords: ["data", "analysis", "spreadsheet", "excel", "sql", "query", "report", "metrics"]
      
      - id: systems
        name: "Systems & Tools"
        description: "Effective use of software systems and productivity tools"
        keywords: ["software", "tool", "system", "platform", "configured", "setup", "integration"]
      
      - id: troubleshooting
        name: "Technical Troubleshooting"
        description: "Diagnosing and resolving technical problems"
        keywords: ["debug", "troubleshoot", "diagnose", "fix", "resolve", "error", "issue"]
      
      - id: security_awareness
        name: "Security Awareness"
        description: "Understanding and applying security principles"
        keywords: ["security", "password", "access", "permission", "privacy", "compliance"]

  # ---------------------------------------------------------------------------
  # COMMUNICATION
  # How you convey information and connect with others
  # ---------------------------------------------------------------------------
  communication:
    name: "Communication"
    skills:
      - id: writing
        name: "Written Communication"
        description: "Clear, effective writing for various audiences"
        keywords: ["wrote", "documented", "drafted", "email", "report", "proposal", "article"]
      
      - id: presentation
        name: "Presentation & Public Speaking"
        description: "Delivering information to groups effectively"
        keywords: ["presented", "demo", "walkthrough", "training", "workshop", "spoke", "audience"]
      
      - id: listening
        name: "Active Listening"
        description: "Understanding others' perspectives and needs"
        keywords: ["listened", "understood", "clarified", "gathered requirements", "interviewed"]
      
      - id: visual
        name: "Visual Communication"
        description: "Using diagrams, charts, and visuals to convey ideas"
        keywords: ["diagram", "chart", "visualization", "wireframe", "mockup", "illustrated"]
      
      - id: feedback
        name: "Giving & Receiving Feedback"
        description: "Constructive exchange of performance information"
        keywords: ["feedback", "review", "critique", "suggestion", "improvement"]

  # ---------------------------------------------------------------------------
  # COLLABORATION
  # Working effectively with others
  # ---------------------------------------------------------------------------
  collaboration:
    name: "Collaboration"
    skills:
      - id: teamwork
        name: "Teamwork"
        description: "Contributing effectively as a team member"
        keywords: ["collaborated", "team", "together", "joint", "shared", "coordinated"]
      
      - id: conflict
        name: "Conflict Resolution"
        description: "Navigating disagreements productively"
        keywords: ["resolved conflict", "mediated", "negotiated", "compromise", "disagreement"]
      
      - id: cross_functional
        name: "Cross-Functional Collaboration"
        description: "Working across departments and disciplines"
        keywords: ["cross-functional", "stakeholder", "department", "interdisciplinary"]
      
      - id: remote
        name: "Remote Collaboration"
        description: "Effective distributed teamwork"
        keywords: ["remote", "async", "virtual", "distributed", "video call", "slack", "teams"]

  # ---------------------------------------------------------------------------
  # PROBLEM SOLVING
  # Analytical and creative thinking
  # ---------------------------------------------------------------------------
  problem_solving:
    name: "Problem Solving"
    skills:
      - id: analytical
        name: "Analytical Thinking"
        description: "Breaking down complex problems systematically"
        keywords: ["analyzed", "evaluated", "assessed", "investigated", "root cause"]
      
      - id: creative
        name: "Creative Problem Solving"
        description: "Finding innovative solutions"
        keywords: ["innovated", "creative", "novel approach", "brainstorm", "ideation"]
      
      - id: decision
        name: "Decision Making"
        description: "Making sound choices with available information"
        keywords: ["decided", "chose", "selected", "evaluated options", "trade-off"]
      
      - id: research
        name: "Research"
        description: "Finding and synthesizing information"
        keywords: ["researched", "investigated", "compared", "evaluated", "benchmarked"]

  # ---------------------------------------------------------------------------
  # ORGANIZATION & PRODUCTIVITY
  # Managing yourself and your work
  # ---------------------------------------------------------------------------
  organization:
    name: "Organization & Productivity"
    skills:
      - id: time_management
        name: "Time Management"
        description: "Effective allocation of time and attention"
        keywords: ["prioritized", "scheduled", "deadline", "on time", "efficient"]
      
      - id: project_management
        name: "Project Management"
        description: "Planning and executing initiatives"
        keywords: ["project", "milestone", "deliverable", "scope", "timeline", "managed project"]
      
      - id: documentation
        name: "Documentation"
        description: "Creating clear records and references"
        keywords: ["documented", "recorded", "wiki", "runbook", "procedure", "manual"]
      
      - id: process
        name: "Process Improvement"
        description: "Optimizing workflows and procedures"
        keywords: ["streamlined", "optimized", "improved process", "efficiency", "workflow"]

  # ---------------------------------------------------------------------------
  # LEADERSHIP
  # Influencing and guiding others
  # ---------------------------------------------------------------------------
  leadership:
    name: "Leadership"
    skills:
      - id: mentoring
        name: "Mentoring & Coaching"
        description: "Developing others' skills and capabilities"
        keywords: ["mentored", "coached", "trained", "guided", "developed", "taught"]
      
      - id: delegation
        name: "Delegation"
        description: "Effectively assigning work to others"
        keywords: ["delegated", "assigned", "empowered", "distributed work"]
      
      - id: influence
        name: "Influence & Persuasion"
        description: "Gaining buy-in and driving change"
        keywords: ["persuaded", "influenced", "convinced", "advocated", "championed"]
      
      - id: vision
        name: "Strategic Vision"
        description: "Setting direction and inspiring others"
        keywords: ["vision", "strategy", "direction", "roadmap", "long-term"]

  # ---------------------------------------------------------------------------
  # DOMAIN KNOWLEDGE
  # Expertise in specific subject areas (customize for your field)
  # ---------------------------------------------------------------------------
  domain:
    name: "Domain Knowledge"
    skills:
      - id: industry
        name: "Industry Knowledge"
        description: "Understanding of your industry's landscape"
        keywords: ["industry", "market", "trends", "competitive", "sector"]
      
      - id: business
        name: "Business Acumen"
        description: "Understanding how organizations create value"
        keywords: ["business", "revenue", "cost", "profit", "roi", "value"]
      
      - id: regulatory
        name: "Regulatory & Compliance"
        description: "Knowledge of relevant rules and standards"
        keywords: ["compliance", "regulation", "policy", "standard", "audit", "governance"]

# =============================================================================
# ACTION PATTERNS
# Keywords that indicate proficiency levels in evidence
# =============================================================================

action_patterns:
  level_1_indicators:
    - "learned about"
    - "was introduced to"
    - "observed"
    - "attended training"
  level_2_indicators:
    - "assisted with"
    - "helped"
    - "supported"
    - "contributed to"
    - "participated in"
  level_3_indicators:
    - "independently"
    - "completed"
    - "delivered"
    - "implemented"
    - "managed"
    - "resolved"
  level_4_indicators:
    - "led"
    - "designed"
    - "architected"
    - "mentored"
    - "optimized"
    - "established"
  level_5_indicators:
    - "transformed"
    - "pioneered"
    - "organization-wide"
    - "strategic"
    - "industry"

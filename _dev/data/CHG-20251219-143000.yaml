  scope: organization-wide

description: |
  Cairn-PKM needed a formal versioning policy to clearly communicate pre-release status and manage version numbers consistently across all components during active development.
  
problem: |
  Version numbers were inflated (5.0, 12.0, etc.) despite system being in active development. No formal policy existed for how to increment versions or when to reach 1.0. This created confusion about system maturity and stability.
  
solution: |
  1. Created VERSION-POLICY.md establishing 0.x.y versioning scheme for pre-release
  2. Updated ARCHITECTURE.md (5.1 → 0.5.0) with new Versioning section
  3. Updated INSTALLATION.md (2.1 → 0.5.0) with pre-release warning
  4. Reset all 9 command files to appropriate 0.x.y versions based on maturity
  5. Added VERSION-POLICY.md reminder comment to all command file headers
  6. Updated all version history tables with reset entries


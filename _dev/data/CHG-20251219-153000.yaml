description: |
  Cairn-PKM distribution infrastructure change affecting all LLM commands. 
  Simplified file output behavior from four modes to three, removing redundant 
  "confirm" mode and making write mode safer by default with built-in confirmation.

problem: |
  Four output modes (display, download, write, confirm) created confusing middle ground.
  - "confirm" mode overlapped with "write" mode functionality
  - Users faced unclear choice between write and confirm
  - <5% of users would choose confirm over display/download or write
  - Pattern added complexity without clear benefit
  - Write mode was unsafe by default (no confirmation)

solution: |
  1. Removed "confirm" as separate mode
  2. Modified write mode to ALWAYS ask for confirmation before writing
  3. Simplified user choice to three clear modes:
     - display: Manual copy/paste control
     - download: Web-based LLM (Claude.ai) downloadable files
     - write: Show content, ask confirmation, then write
  4. Updated all command specifications to reflect new pattern
  5. Updated user-facing documentation (ARCHITECTURE, INSTALLATION)
  6. Updated user-prefs.yaml template with new three-mode system


description: |
  Change tracking system (cmd-change.md) lacked ability to review historical changes.
  Users needed to manually browse YAML files in _local/data/changelog/ directory structure.

problem: |
  No built-in way to review change history from stored YAML files. Users had to:
  - Navigate filesystem manually to find change files
  - Open individual YAML files to see what changed
  - No date-based filtering or narrative summary view
  - Difficult to get overview of recent work

solution: |
  1. Designed !change-r subcommand with date filtering capabilities:
     - !change-r (last 30 days default)
     - !change-r [days] (last N days)
     - !change-r [YYYY-MM] (specific month)
     - !change-r [start] [end] (date range)
  2. Created initial standalone spec (cmd-change-r.md)
  3. Integrated as subcommand into cmd-change.md v3.1
  4. Display format shows: title, filename, systems, implementer, problem summary
  5. Chronological display (newest first) with flat list structure
  6. Verified compliance with existing output behavior patterns


  - OpenSSL

problem_category: security

change_classification:
  impact: medium
  risk: low
  reversibility: instant
  scope: single-system

description: |
  Staging server was rejecting SSL connections due to incomplete certificate chain.
  Clients received "unable to verify the first certificate" error.

problem: |
  nginx was only serving the leaf certificate without the intermediate CA certificate.
  SSL Labs testing showed incomplete chain, browsers displayed security warnings.
  Verified with openssl s_client showing only one certificate in chain.

solution: |
  1. Diagnosed issue using: openssl s_client -connect staging.acme.com:443 -showcerts
  2. Confirmed intermediate certificate was missing from chain
  3. Updated nginx configuration to use fullchain.pem:
     - ssl_certificate /etc/nginx/ssl/fullchain.pem
     - ssl_certificate_key /etc/nginx/ssl/privkey.pem
  4. Concatenated leaf + intermediate certificates into fullchain.pem
  5. Reloaded nginx service
  6. Validated with SSL Labs - achieved A rating with complete chain

files_modified:
  - /etc/nginx/ssl/fullchain.pem
  - /etc/nginx/sites-available/staging.acme.com.conf


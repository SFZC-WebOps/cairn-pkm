description: |
  Home office conversion in spare bedroom required additional power capacity.
  Original room had only 2 outlets, both on opposite wall from planned desk location.
  Needed dedicated power for height-adjustable desk, dual monitors, laptop dock,
  USB hub, and task lighting without overloading circuits.

problem: |
  Insufficient electrical capacity and poorly positioned outlets for office setup:
  
  - Only 2 existing outlets, both on north wall
  - Desk location required outlets on south wall (window glare considerations)
  - Standing desk alone needs 120W for motors
  - Dual monitors + laptop dock + peripherals = additional 200W+ 
  - Extension cords across room presented safety and aesthetic issues
  - Risk of overloading single circuit with all equipment
  
  Attempting to run office equipment from existing outlets would require long
  extension cords creating trip hazards and potential fire risk from overload.

solution: |
  Mike Torres (licensed electrician) added 2 new outlets and replaced old switch:
  
  1. Verified circuit capacity on existing bedroom circuit (15A)
  2. Added 2 new duplex outlets on south wall near desk location
     - 18" above floor for easy desk access
     - Spaced 6 feet apart for flexibility
     - Wired to existing circuit (verified safe load)
  3. Replaced old 1960s toggle switch with modern decora switch
     - Old switch was loose and unreliable
     - New switch includes ground connection
  4. Tested all outlets with circuit tester
  5. Verified no voltage drop under full load
  
  Work completed in 3.5 hours with minimal drywall patching required.


description: |
  Modified lighting plan for home office before installation began. Original 
  design called for recessed can lights in ceiling. After further research and
  contractor input, switched to track lighting system for better functionality
  and cost savings.

problem: |
  Original recessed can light plan had several drawbacks:
  
  - Required cutting into ceiling (older home, potential asbestos concerns)
  - Fixed light positions couldn't be adjusted after installation
  - Poor for video calls (overhead lighting creates shadows on face)
  - More expensive: $480 for fixtures + additional ceiling work
  - Longer installation time (5-6 hours estimated)
  - Ceiling repair and painting would add 2-3 days
  
  Contractor (Mike Torres) suggested reconsidering the recessed approach
  given the flexibility needs for video conferencing and potential future
  desk rearrangement.

solution: |
  Changed to track lighting system after consultation with Mike:
  
  Decision factors:
  1. Flexibility: Can adjust light direction as needed
     - Point lights at walls for indirect lighting during calls
     - Direct task lighting when needed for detailed work
     - Can add/remove/reposition fixtures on track
  
  2. Cost savings: Track system is $280 vs $480 for recessed
     - 4-head track system with LED bulbs: $280
     - No ceiling work required (saves contractor labor)
     - No drywall repair or painting needed
     - Total savings: ~$200
  
  3. Installation: Simpler and faster
     - Mounts to existing junction box
     - 3-4 hour installation vs 5-6 hours + repair time
     - Can complete in single visit
  
  4. Better for video calls: Adjustable direction prevents harsh shadows
  
  Mike approved the change and confirmed electrical box can support track weight.
  Ordered fixtures on Dec 15, arriving Dec 23, installation scheduled Dec 27.


problem_category: configuration

change_classification:
  impact: high
  risk: high
  reversibility: days
  scope: organization-wide

description: |
  Migrated 2.5TB of application files from aging NAS hardware to AWS S3.
  Implemented lifecycle policies and automated backup procedures. This eliminates
  hardware failure risk and reduces storage costs by 35% annually.
  
problem: |
  On-premises NAS storage experiencing reliability issues:
  - Drive failures (2 in last 6 months)
  - Backup windows extending into business hours
  - Annual maintenance cost of $8,500
  - No geographic redundancy
  - Limited scalability for growing data needs
  - Restore time from backups: 6-8 hours
  
solution: |
  1. Created AWS S3 bucket with versioning enabled
  2. Configured lifecycle policies:
     - Transition to S3-IA after 90 days
     - Transition to Glacier after 365 days
     - Delete after 2555 days (7 years retention)
  3. Wrote Python migration script using boto3
  4. Performed incremental sync over 3 days during low-usage periods
  5. Updated application code to use S3 SDK instead of file system
  6. Configured CloudWatch alarms for unusual access patterns
  7. Set up cross-region replication to us-west-2 for disaster recovery
  8. Validated data integrity using MD5 checksums
  9. Ran parallel systems for 1 week before NAS decommission
  10. Created comprehensive rollback procedure with data restoration tests


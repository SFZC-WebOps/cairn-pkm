  scope: organization-wide

description: |
  Deployed new customer self-service portal allowing account management, billing
  history, and support ticket creation without agent assistance. Expected to
  reduce support workload by 40% based on beta testing results.
  
problem: |
  Customer support team handling high volume of routine requests:
  - Password resets (150/week)
  - Billing history requests (80/week)
  - Account information updates (60/week)
  - Support ticket creation requiring email/phone handoff
  Total support time spent: ~25 hours/week on automatable tasks
  
solution: |
  1. Deployed Django application to portal.example.com
  2. Configured PostgreSQL connection pool for user database
  3. Set up Redis for session management and caching
  4. Implemented OAuth 2.0 authentication with existing user system
  5. Configured nginx reverse proxy with SSL
  6. Set up Docker Compose for service orchestration
  7. Configured automated database backups
  8. Implemented monitoring with Prometheus/Grafana
  9. Created rollback procedure and tested in staging
  10. Deployed with zero-downtime strategy using blue-green deployment

files_modified:
  - /opt/customer-portal/docker-compose.yml
  - /opt/customer-portal/config/settings.py
  - /etc/nginx/sites-available/portal.example.com
  - /opt/customer-portal/config/gunicorn.conf.py
  - /var/backup/scripts/portal-db-backup.sh

rollback:
  complexity: medium
  estimated_time: "1 hour"
  steps:
    - action: "Switch nginx upstream to maintenance page"
      validation: "nginx -t && systemctl reload nginx"
    - action: "Stop Docker containers"
      validation: "docker-compose down"
    - action: "Restore previous database state if needed"
      validation: "Run backup restore script with timestamp"
    - action: "Notify users of temporary maintenance"
      validation: "Email sent via notification system"

validation:

description: |
  Major documentation streamlining of Cairn-PKM LLM command specifications.
  Reduced 11 command files from 102K to 43K (58% reduction) by eliminating
  redundancies and centralizing common patterns. Restructured LLM folder
  with underscore-prefixed system docs and organized uploads directory.

problem: |
  LLM command specification files had grown bloated with duplicated patterns
  across multiple files. Common elements like initialization, error handling,
  datetime output, and completion patterns were copy-pasted into each command
  file, creating maintenance overhead and inconsistency risk.

solution: |
  1. Analyzed all 11 cmd-*.md files for redundancy patterns
  2. Created cmd-shared-patterns.md to centralize:
     - Initialization pattern (user prefs reading)
     - DateTime output format
     - Completion pattern
     - Common error handling
     - Encoding requirements (ftfy)
     - Vault path references
  3. Streamlined each command file to reference shared patterns
  4. Renamed system docs with underscore prefix:
     - ARCHITECTURE.md → _ARCHITECTURE.md
     - INSTALLATION.md → _INSTALLATION.md
     - VERSION-POLICY.md → _VERSION-POLICY.md
  5. Renamed instructions.md → llm-project-instructions.md
  6. Restructured into _cairn-pkm/llm/uploads/ folder
  7. Verified encoding clean across all files
  8. Deployed to vault and Claude project (14 files final)
  9. Removed obsolete duplicates from Claude project

